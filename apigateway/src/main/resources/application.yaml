server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ruta-ms-usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/usuarios,/api/usuarios/**
            - id: ruta-ms-compromisos
              uri: lb://ms-compromisos
              predicates:
                - Path=/api/empresas/**,/api/compromisos/**,/api/pagos/**,/api/reportes/**,/api/logros/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
